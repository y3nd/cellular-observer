; LilyGO T-SIM7670G-S3 H707 (ESP32-S3 N16R8) stacked on the H783
; T-Sim Shield. The shield carries an SX1262 and routes its SPI bus to the
; H707 pins below. The SIM7670G is exposed as an ESP-IDF PPP netif, so the
; existing MQTT/TLS stack uses LTE without transport-specific changes.

[LilyGo_T_SIM7670G_S3_Shield]
extends = esp32_base
; Arduino-ESP32 3.x supplies Network/PPP (esp_modem). Keep this aligned with
; the known-good standalone H707 project used to validate this board.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = lilygo-t-sim7670g-s3
board_check = true
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 460800
build_flags =
  ${esp32_base.build_flags}
  -I variants/lilygo_t_sim7670g_s3
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D LILYGO_T_SIM7670G_S3
  -D P_LORA_DIO_1=6
  -D P_LORA_NSS=39
  -D P_LORA_RESET=40
  -D P_LORA_BUSY=38
  -D P_LORA_SCLK=16
  -D P_LORA_MISO=7
  -D P_LORA_MOSI=15
  -D PIN_BOARD_SDA=2
  -D PIN_BOARD_SCL=1
  -D PIN_USER_BTN=0
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D OFFBAND_LTE_MODEM_RX=10
  -D OFFBAND_LTE_MODEM_TX=11
  -D OFFBAND_LTE_MODEM_PWRKEY=18
  -D OFFBAND_LTE_MODEM_RESET=17
  -D OFFBAND_LTE_MODEM_DTR=9
  -D OFFBAND_LTE_APN='"${node_secrets.lte_apn}"'
  -D OFFBAND_LTE_SIM_PIN='"${node_secrets.lte_sim_pin}"'
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/lilygo_t_sim7670g_s3>
lib_deps =
  ${esp32_base.lib_deps}

[env:LilyGo_T_SIM7670G_S3_Shield_companion_observer_lte]
extends = LilyGo_T_SIM7670G_S3_Shield
build_flags =
  ${LilyGo_T_SIM7670G_S3_Shield.build_flags}
  -I examples/companion_radio/ui-new
  -DMAX_GROUP_CHANNELS=5
  -Wno-builtin-macro-redefined
  -D BLE_PIN_CODE=358732
  -D CONFIG_BT_NIMBLE_ENABLED=1
  -D CONFIG_BT_BLUEDROID_ENABLED=0
  -D OFFBAND_OBSERVER
  -D OFFBAND_OBSERVER_BLE_COMPANION
  -D OFFBAND_OBSERVER_CELLULAR
  -D ENV_INCLUDE_GPS=1
  -D OFFBAND_HEARTBEAT_SERIAL=0
  -D OFFBAND_ROTATION_STATUS_SERIAL=0
  -D OFFBAND_CAPLOG_FORWARD=1
  -D WITH_MQTT_UPLINK
  -D MAX_CONTACTS=5
  -D MAX_ANON_CONTACTS=3
  -D OFFBAND_MAX_BROKERS=6
  -D OFFLINE_QUEUE_SIZE=16
build_src_filter = ${LilyGo_T_SIM7670G_S3_Shield.build_src_filter}
  +<helpers/esp32/SerialBLEInterface.cpp>
  +<helpers/wifi_observer/*.cpp>
  +<helpers/cellular_observer/*.cpp>
  +<helpers/config/*.cpp>
  +<helpers/diagnostics/*.cpp>
  +<../examples/companion_radio/*.cpp>
lib_deps =
  ${LilyGo_T_SIM7670G_S3_Shield.lib_deps}
  densaugeo/base64 @ ~1.4.0
  ${esp32_ble.lib_deps}
